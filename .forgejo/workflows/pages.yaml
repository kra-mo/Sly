name: Deploy Demo
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v7

      - uses: https://github.com/samueldr/lix-gha-installer-action@v2026-06-15
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes flake-self-attrs

      - run: nix build .#web

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://demo.sly.pictures/
          server: codeberg.page
          token: ${{ forge.token }}
          source: result/
